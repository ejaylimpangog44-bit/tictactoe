
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic-Tac-Toe: Player vs AI</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="game-container">
        <header class="game-header">
            <h1>Tic-Tac-Toe</h1>
            <p>Challenge the AI and get three in a row!</p>
        </header>

        <section class="game-controls" aria-label="Game controls">
            <label for="difficulty">Difficulty</label>

            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="normal" selected>Normal</option>
                <option value="hard">Hard</option>
            </select>

            <button id="start-btn" type="button">
                Start New Game
            </button>

            <button id="restart-btn" type="button" class="secondary-btn">
                Restart
            </button>
        </section>

        <section class="game-area" aria-label="Tic-Tac-Toe game">
            <p id="status" role="status" aria-live="polite">
                Your turn! Choose an empty square.
            </p>

            <div class="board" role="group" aria-label="Game board">
                <button class="cell" data-index="0" type="button"
                    aria-label="Position 1: empty"></button>
                <button class="cell" data-index="1" type="button"
                    aria-label="Position 2: empty"></button>
                <button class="cell" data-index="2" type="button"
                    aria-label="Position 3: empty"></button>

                <button class="cell" data-index="3" type="button"
                    aria-label="Position 4: empty"></button>
                <button class="cell" data-index="4" type="button"
                    aria-label="Position 5: empty"></button>
                <button class="cell" data-index="5" type="button"
                    aria-label="Position 6: empty"></button>

                <button class="cell" data-index="6" type="button"
                    aria-label="Position 7: empty"></button>
                <button class="cell" data-index="7" type="button"
                    aria-label="Position 8: empty"></button>
                <button class="cell" data-index="8" type="button"
                    aria-label="Position 9: empty"></button>
            </div>
        </section>

        <footer class="game-footer">
            <p>You are <strong class="player-symbol">X</strong>
                · AI is <strong class="ai-symbol">O</strong></p>
        </footer>
    </main>
</body>
</html>
